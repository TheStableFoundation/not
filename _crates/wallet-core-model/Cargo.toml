[package]
name = "smbcloud-wallet-core-model"
version = "1.0.9"
edition = "2021"
description = "smbCloud Wallet Core Model for NotWallet Crypto."
authors = ["smbCloud Team <smbcloud@setoelkahfi.se>"]
license = "MIT"
homepage = "https://github.com/TheStableFoundation/notwallet/tree/development/_crates/smbcloud-wallet-core-model"
repository = "https://github.com/TheStableFoundation/notwallet/"
documentation = "https://github.com/TheStableFoundation/notwallet/tree/main/docs"
keywords = ["solana", "wallet", "crypto"]
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "smbcloud_wallet_core_model"

[dependencies]
log = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smbcloud-wallet-constants = { workspace = true }
smbcloud-wallet-core-network = { workspace = true }
smbcloud-wallet-core-rpc = { workspace = true }
tsync = "2"
uniffi = { workspace = true }
