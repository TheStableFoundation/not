[package]
name = "smbcloud-wallet-core-rpc"
version = "1.0.9"
edition = "2021"
description = "smbCloud Wallet Core RPC for NotWallet Crypto."
authors = ["smbCloud Team <smbcloud@setoelkahfi.se>"]
license = "MIT"
homepage = "https://github.com/TheStableFoundation/notwallet/tree/development/_crates/smbcloud-wallet-core-rpc"
repository = "https://github.com/TheStableFoundation/notwallet/"
documentation = "https://github.com/TheStableFoundation/notwallet/tree/main/docs"
keywords = ["solana", "wallet", "crypto"]
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "smbcloud_wallet_core_rpc"

[dependencies]
log = "0.4.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smbcloud-wallet-constants = { workspace = true }
smbcloud-wallet-core-network = { workspace = true }
solana-account-decoder = { workspace = true }
solana-client = { workspace = true }
solana-pubkey = "3"
solana-rpc-client = { workspace = true }
solana-sdk = "3"
