[package]
name = "smbcloud-wallet-core-network"
version = "1.0.9"
edition = "2021"
description = "smbCloud Wallet Core Network for NotWallet Crypto."
authors = ["smbCloud Team <smbcloud@setoelkahfi.se>"]
license = "MIT"
homepage = "https://github.com/TheStableFoundation/notwallet/tree/development/_crates/smbcloud-wallet-core-network"
repository = "https://github.com/TheStableFoundation/notwallet/"
documentation = "https://github.com/TheStableFoundation/notwallet/tree/main/docs"
keywords = ["solana", "wallet", "crypto"]
readme = "README.md"

[lib]
crate-type = ["lib"]
name = "smbcloud_wallet_core_network"

[dependencies]
bs58 = "0.5.0"
env_logger = "0.10"
log = "0.4.20"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
strum = "0.27"
strum_macros = "0.27"
thiserror = "1.0.56"
tokio = { version = "1.35.1", features = ["full"] }
tsync = "2"
