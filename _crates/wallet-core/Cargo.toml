[package]
name = "smbcloud-wallet-core"
version = "1.0.9"
edition = "2021"
description = "smbCloud Wallet Core for NotWallet Crypto."
authors = ["smbCloud Team <smbcloud@setoelkahfi.se>"]
license = "MIT"
homepage = "https://github.com/TheStableFoundation/notwallet/tree/development/_crates/smbcloud-wallet-core"
repository = "https://github.com/TheStableFoundation/notwallet/"
documentation = "https://github.com/TheStableFoundation/notwallet/tree/main/docs"
keywords = ["solana", "wallet", "crypto"]
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "smbcloud_wallet_core"

[dependencies]
bip39 = { version = "2", features = ["rand"] }
bs58 = "0.5.0"
log = "0.4.20"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smbcloud-wallet-constants = { workspace = true }
smbcloud-wallet-core-http = { workspace = true }
smbcloud-wallet-core-model = { workspace = true }
smbcloud-wallet-core-network = { workspace = true }
smbcloud-wallet-core-rpc = { workspace = true }
solana-account-decoder = { workspace = true }
solana-client = { workspace = true }
solana-derivation-path = "3"
solana-pubkey = "3"
solana-rpc-client = { workspace = true }
solana-sdk = "3"
tokio = { version = "1.35.1", features = ["full"] }
